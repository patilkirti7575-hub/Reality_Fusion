<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealityFusionLogin - RealityFusion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <style>
        :root {
            --ig-bg: #000000;
            --ig-card-bg: #000000;
            --ig-border: #262626;
            --ig-text-primary: #f5f5f5;
            --ig-text-secondary: #a8a8a8;
            --ig-link: #0095f6;
            --ig-hover: #1a1a1a;
            --ig-sidebar-width: 244px;
            --ig-content-width: 630px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--ig-bg);
            color: var(--ig-text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        a { color: var(--ig-text-primary); text-decoration: none; }
        a:hover { color: var(--ig-text-primary); }

        /* ===== SIDEBAR ===== */
        .ig-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--ig-sidebar-width);
            height: 100vh;
            border-right: 1px solid var(--ig-border);
            background: var(--ig-bg);
            padding: 8px 12px 20px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
        }
        .ig-sidebar .logo {
            padding: 25px 12px 16px;
            margin-bottom: 8px;
        }
        .ig-sidebar .logo h2 {
            font-family: 'Grand Hotel', cursive;
            font-size: 28px;
            font-weight: 400;
            color: var(--ig-text-primary);
            letter-spacing: 0.5px;
        }
        .ig-sidebar .logo h2 span { font-family: inherit; }
        .nav-item-ig {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 2px 0;
            border-radius: 8px;
            transition: background 0.15s;
            cursor: pointer;
            color: var(--ig-text-primary);
            text-decoration: none;
        }
        .nav-item-ig:hover { background: var(--ig-hover); }
        .nav-item-ig i {
            font-size: 24px;
            width: 24px;
            text-align: center;
            margin-right: 16px;
        }
        .nav-item-ig .nav-label {
            font-size: 16px;
            line-height: 24px;
        }
        .nav-item-ig.active i { font-weight: 900; }
        .nav-item-ig.active .nav-label { font-weight: 700; }
        .nav-profile-img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 16px;
        }
        .sidebar-spacer { flex: 1; }
        .sidebar-more { margin-top: auto; }

        /* ===== MAIN LAYOUT ===== */
        .ig-main {
            margin-left: var(--ig-sidebar-width);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .ig-content {
            width: 100%;
            max-width: var(--ig-content-width);
            padding: 30px 20px 20px;
        }

        /* ===== STORIES ===== */
        .stories-bar {
            display: flex;
            gap: 16px;
            padding: 16px 0;
            margin-bottom: 24px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .stories-bar::-webkit-scrollbar { display: none; }
        .story-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 64px;
            cursor: pointer;
        }
        .story-ring {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        .story-ring-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--ig-bg);
            padding: 2px;
        }
        .story-ring-inner img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .story-name {
            font-size: 11px;
            color: var(--ig-text-secondary);
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: var(--ig-card-bg);
            border: 1px solid var(--ig-border);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .post-header {
            display: flex;
            align-items: center;
            padding: 14px 16px;
        }
        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
        }
        .post-username {
            font-size: 14px;
            font-weight: 600;
            color: var(--ig-text-primary);
        }
        .post-location {
            font-size: 12px;
            color: var(--ig-text-secondary);
        }
        .post-options { margin-left: auto; color: var(--ig-text-primary); cursor: pointer; }
        .post-image-container {
            background: var(--ig-bg);
            display: flex;
            justify-content: center;
        }
        .post-image-container img {
            width: 100%;
            max-height: 585px;
            object-fit: contain;
        }
        .post-image-placeholder {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ig-text-secondary);
        }
        .post-actions {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 16px;
        }
        .post-actions i {
            font-size: 24px;
            cursor: pointer;
            color: var(--ig-text-primary);
            transition: 0.15s;
        }
        .post-actions i:hover { opacity: 0.7; }
        .post-actions .save-btn { margin-left: auto; }
        .post-likes {
            padding: 0 16px 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ig-text-primary);
        }
        .post-caption {
            padding: 0 16px 8px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--ig-text-primary);
        }
        .post-caption strong { margin-right: 4px; }
        .post-comments-link {
            padding: 0 16px 4px;
            font-size: 14px;
            color: var(--ig-text-secondary);
            cursor: pointer;
        }
        .post-comments-link:hover { color: var(--ig-text-secondary); }
        .post-comment {
            padding: 0 16px 2px;
            font-size: 14px;
            line-height: 1.5;
        }
        .post-comment strong { margin-right: 4px; }
        .post-time {
            padding: 0 16px 12px;
            font-size: 10px;
            color: var(--ig-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }
        .post-add-comment {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-top: 1px solid var(--ig-border);
        }
        .post-add-comment input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--ig-text-primary);
            padding: 8px 0;
            font-size: 14px;
            outline: none;
        }
        .post-add-comment input::placeholder { color: var(--ig-text-secondary); }
        .post-add-comment button {
            background: transparent;
            border: none;
            color: var(--ig-link);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.5;
        }
        .post-add-comment button:active { opacity: 1; }
        .liked { color: #ed4956 !important; }
        .saved { color: var(--ig-text-primary); }

        /* ===== STORY VIEWER ===== */
        .story-viewer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .story-viewer-overlay.active { display: flex; }
        .story-viewer {
            width: 400px;
            max-width: 92vw;
            height: 720px;
            max-height: 95vh;
            background: #000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .story-viewer .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 20;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .story-viewer .close-btn:hover { background: rgba(255,255,255,0.2); }
        .story-viewer .story-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            position: relative;
        }
        .story-viewer .story-content img,
        .story-viewer .story-content video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .story-viewer .story-content .no-story {
            text-align: center;
            padding: 40px;
        }
        .story-viewer .story-content .no-story .icon {
            font-size: 64px;
            color: #363636;
            margin-bottom: 16px;
        }
        .story-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 4px;
            padding: 10px 10px 0;
            z-index: 15;
        }
        .story-progress-bar {
            flex: 1;
            height: 2px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .story-progress-bar .fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }
        .story-progress-bar .fill.active { background: #0095f6; }
        .story-viewer .story-user-info {
            position: absolute;
            top: 30px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 15;
        }
        .story-viewer .story-user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .story-viewer .story-user-info .story-avatar-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #363636;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #555;
        }
        .story-viewer .story-user-info .name {
            font-size: 14px;
            font-weight: 600;
            color: white;
        }
        .story-viewer .story-user-info .time {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
        .story-viewer .story-caption {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 12px;
            color: white;
            font-size: 14px;
            z-index: 15;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .story-viewer .nav-area {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 35%;
            z-index: 12;
            cursor: pointer;
        }
        .story-viewer .nav-area.prev { left: 0; }
        .story-viewer .nav-area.next { right: 0; }
        .story-viewer .delete-btn {
            position: absolute;
            bottom: 60px;
            right: 12px;
            color: rgba(255,255,255,0.6);
            font-size: 18px;
            cursor: pointer;
            z-index: 15;
            transition: 0.2s;
        }
        .story-viewer .delete-btn:hover { color: #ed4956; }
        .story-ring.has-story {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important;
        }
        .story-ring.no-story {
            background: linear-gradient(45deg, #262626, #262626) !important;
        }
        .story-ring.viewed-story {
            background: linear-gradient(45deg, #555, #555) !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1264px) {
            :root { --ig-sidebar-width: 72px; }
            .nav-label { display: none !important; }
            .nav-item-ig i { margin-right: 0; }
            .nav-item-ig { justify-content: center; padding: 12px; }
            .ig-sidebar .logo h2 { display: none; }
            .ig-sidebar .logo { padding: 25px 0 16px; text-align: center; }
        }
        @media (max-width: 768px) {
            .ig-sidebar { display: none; }
            .ig-main { margin-left: 0; }
            .ig-content { padding: 60px 0 56px; }
            .stories-bar { padding: 8px 12px; margin-bottom: 0; }
            .post-card { border-left: none; border-right: none; border-radius: 0; }
        }

/* ===== BOTTOM NAV MOBILE ===== */
.ig-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: var(--ig-bg);
    border-top: 1px solid var(--ig-border);
    display: none;
    z-index: 100;
    justify-content: space-around;
    align-items: center;
    padding: 0 8px;
}
@media (max-width: 768px) {
    .ig-bottom-nav { display: flex; }
}
        .ig-bottom-nav a {
            color: var(--ig-text-primary);
            font-size: 22px;
            padding: 8px;
        }
        .ig-bottom-nav a:hover { color: var(--ig-text-primary); }
        .ig-bottom-nav a .profile-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* ===== SEARCH MODAL ===== */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            z-index: 1000;
            justify-content: center;
            padding-top: 80px;
        }
        .search-overlay.active { display: flex; }
        .search-modal {
            width: 400px;
            max-width: 90%;
            background: #262626;
            border-radius: 12px;
            height: fit-content;
            max-height: 400px;
            overflow-y: auto;
        }
        .search-modal input {
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--ig-border);
            color: var(--ig-text-primary);
            font-size: 16px;
            outline: none;
        }
        .search-modal input::placeholder { color: var(--ig-text-secondary); }
        .search-result-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            color: var(--ig-text-primary);
            text-decoration: none;
        }
        .search-result-item:hover { background: #363636; }
        .search-result-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
        }
        .search-result-item .info strong { display: block; font-size: 14px; }
        .search-result-item .info span { font-size: 12px; color: var(--ig-text-secondary); }

        /* ===== PROFILE GRID ===== */
        .profile-header {
            display: flex;
            padding: 30px 0 44px;
            gap: 30px;
        }
        .profile-avatar-lg {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-avatar-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #363636;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .profile-info { flex: 1; }
        .profile-info .username-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .profile-info .username-row h2 { font-size: 20px; font-weight: 400; }
        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }
        .profile-stats strong { font-size: 16px; display: block; }
        .profile-stats span { font-size: 16px; }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding-top: 12px;
            border-top: 1px solid var(--ig-border);
        }
        .profile-grid-item {
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
        }
        .profile-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-grid-placeholder {
            aspect-ratio: 1;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ig-text-secondary);
            font-size: 14px;
            border: 1px solid var(--ig-border);
        }

        /* ===== RECOMMENDED SIDEBAR ===== */
        .side-rec {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            padding: 60px 32px 0;
            display: none;
        }
        .side-rec .suggestions h6 {
            color: var(--ig-text-secondary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
        }
        .suggestion-item img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
        }
        .suggestion-item .info { flex: 1; }
        .suggestion-item .info strong { font-size: 14px; display: block; }
        .suggestion-item .info span { font-size: 12px; color: var(--ig-text-secondary); }
        .suggestion-item .follow-btn {
            color: var(--ig-link);
            font-size: 12px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
        }
        @media (min-width: 1500px) {
            .side-rec { display: block; }
        }

        /* ===== BUTTONS ===== */
        .ig-btn-primary {
            background: var(--ig-link);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .ig-btn-primary:hover { background: #1877f2; }
        .ig-btn-secondary {
            background: transparent;
            color: var(--ig-text-primary);
            border: 1px solid var(--ig-border);
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .ig-btn-secondary:hover { background: var(--ig-hover); }

        /* ===== MISC ===== */
        .page-title { font-size: 24px; font-weight: 500; margin-bottom: 20px; }
        .no-posts { text-align: center; padding: 60px 20px; color: var(--ig-text-secondary); }
        .no-posts i { font-size: 48px; margin-bottom: 16px; display: block; }

        /* ===== LIKE ANIMATION ===== */
        @keyframes likePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .like-anim { animation: likePop 0.3s ease; }

        /* ===== EMOJI PICKER ===== */
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 0;
            background: #262626;
            border: 1px solid #363636;
            border-radius: 12px;
            padding: 8px;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .emoji-picker.active { display: flex; flex-wrap: wrap; gap: 4px; }
        .emoji-picker span {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .emoji-picker span:hover { background: #363636; }
        .emoji-wrapper { position: relative; display: inline-block; }
        .emoji-picker::-webkit-scrollbar { width: 4px; }
        .emoji-picker::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        /* ===== SHARE MODAL ===== */
        .share-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 9998;
            align-items: center; justify-content: center;
        }
        .share-modal-overlay.active { display: flex; }
        .share-modal {
            width: 400px; max-width: 90vw; background: #1a1a1a;
            border-radius: 16px; overflow: hidden;
        }
        .share-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; border-bottom: 1px solid #262626;
        }
        .share-modal-header h6 { margin: 0; font-size: 16px; font-weight: 600; }
        .share-modal-header .close { background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 0 4px; }
        .share-modal-search { padding: 12px 16px; }
        .share-modal-search input {
            width: 100%; padding: 10px 14px; background: #262626; border: none;
            border-radius: 8px; color: white; font-size: 14px; outline: none;
        }
        .share-modal-search input::placeholder { color: #555; }
        .share-modal-users { max-height: 350px; overflow-y: auto; padding: 0 0 8px; }
        .share-user-item {
            display: flex; align-items: center; padding: 10px 16px; cursor: pointer;
            transition: 0.15s; color: white; text-decoration: none;
        }
        .share-user-item:hover { background: #262626; }
        .share-user-item img {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover; margin-right: 12px;
        }
        .share-user-item .avatar-placeholder {
            width: 44px; height: 44px; border-radius: 50%; background: #363636;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 20px; color: #555;
        }
        .share-user-item .info { flex: 1; }
        .share-user-item .info strong { font-size: 14px; display: block; }
        .share-user-item .info span { font-size: 12px; color: #555; }
        .share-user-item .send-btn {
            background: #0095f6; color: white; border: none; padding: 6px 16px;
            border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .share-user-item .send-btn:hover { background: #1877f2; }
        .share-success-toast {

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ===== SEARCH =====
function openSearch() {
    document.getElementById('searchOverlay').classList.add('active');
    setTimeout(() => document.getElementById('searchInput').focus(), 100);
}
function closeSearch(e) {
    if (e.target === document.getElementById('searchOverlay')) {
        document.getElementById('searchOverlay').classList.remove('active');
    }
}
function searchUsers(query) {
    if (query.length < 1) { document.getElementById('searchResults').innerHTML = ''; return; }
    fetch('/users/search/?q=' + encodeURIComponent(query))
    .then(r => r.json())
    .then(data => {
        const container = document.getElementById('searchResults');
        container.innerHTML = '';
        data.users.forEach(u => {
            const a = document.createElement('a');
            a.href = '/users/profile/' + u.id + '/';
            a.className = 'search-result-item';
            a.innerHTML = (u.profile_pic
                ? '<img src="' + u.profile_pic + '">'
                : '<div style="width:44px;height:44px;border-radius:50%;background:#363636;display:flex;align-items:center;justify-content:center;margin-right:12px;font-size:20px;color:#555;"><i class="bi bi-person-fill"></i></div>'
            ) + '<div class="info"><strong>' + u.username + '</strong><span>' + u.email + '</span></div>';
            container.appendChild(a);
        });
        if (data.users.length === 0) {
            container.innerHTML = '<div style="padding:16px;text-align:center;color:#555;">No users found</div>';
        }
    });
}

// ===== LIKE TOGGLE =====
document.addEventListener('click', function(e) {
    const likeBtn = e.target.closest('.like-btn');
    if (likeBtn) {
        const postId = likeBtn.dataset.postId;
        const icon = likeBtn;
        const card = likeBtn.closest('.post-card, .reel-card');
        const count = card ? card.querySelector('.likes-count') : null;
        fetch('/post/' + postId + '/like/', {
            method: 'POST',
            headers: {'X-CSRFToken': 'J2piKfV0WBUJzD75sYVyS5DsoZ7USGWhjDRvZaGdVugs4X71YQbaKQ4wbxNUNnV9'}
        })
        .then(r => r.json())
    .then(data => {
        if (count) count.textContent = data.likes_count;
        icon.classList.toggle('liked');
        icon.classList.remove('bi-heart', 'bi-heart-fill');
        icon.classList.add(data.liked ? 'bi-heart-fill' : 'bi-heart');
        icon.classList.add('like-anim');
        setTimeout(() => icon.classList.remove('like-anim'), 300);
    });
    }
});

// ===== COMMENT FROM FEED =====
document.addEventListener('submit', function(e) {
    const form = e.target.closest('.comment-form');
    if (form) {
        e.preventDefault();
        const postId = form.dataset.postId;
        const input = form.querySelector('input[name="content"]');
        if (!input) return;
        const content = input.value.trim();
        if (!content) return;
        fetch('/post/' + postId + '/comment/', {
            method: 'POST',
            headers: {'X-CSRFToken': 'J2piKfV0WBUJzD75sYVyS5DsoZ7USGWhjDRvZaGdVugs4X71YQbaKQ4wbxNUNnV9', 'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'content=' + encodeURIComponent(content)
        })
        .then(r => r.json())
        .then(data => {
            input.value = '';
            location.reload();
        });
    }
});

// ===== SHARE BUTTON =====
let sharePostId = null;
let allShareUsers = [];

document.addEventListener('click', function(e) {
    const shareBtn = e.target.closest('.share-btn');
    if (shareBtn) {
        sharePostId = shareBtn.dataset.postId;
        openShareModal();
    }
});

function openShareModal() {
    const modal = document.getElementById('shareModal');
    modal.classList.add('active');
    loadShareUsers();
    document.getElementById('shareSearch').value = '';
    document.getElementById('shareSearch').focus();
}

function closeShareModal(e) {
    if (!e || e.target === document.getElementById('shareModal')) {
        document.getElementById('shareModal').classList.remove('active');
    }
}

function loadShareUsers() {
    const list = document.getElementById('shareUsersList');
    list.innerHTML = '<div style="text-align:center;padding:20px;color:#555;"><i class="bi bi-arrow-repeat" style="font-size:24px;display:block;margin-bottom:8px;"></i>Loading...</div>';
    fetch('/users/search/?q=')
    .then(r => r.json())
    .then(data => {
        allShareUsers = data.users.filter(u => parseInt(u.id) !== parseInt('None'));
        renderShareUsers(allShareUsers);
    });
}

function renderShareUsers(users) {
    const list = document.getElementById('shareUsersList');
    if (users.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:30px;color:#555;"><i class="bi bi-person-x" style="font-size:32px;display:block;margin-bottom:8px;"></i>No users found</div>';
        return;
    }
    list.innerHTML = '';
    users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'share-user-item';
        div.innerHTML = (u.profile_pic
            ? '<img src="' + u.profile_pic + '">'
            : '<div class="avatar-placeholder"><i class="bi bi-person-fill"></i></div>'
        ) + '<div class="info"><strong>' + u.username + '</strong><span>' + u.email + '</span></div>'
        + '<button class="send-btn" onclick="sendShare(' + u.id + ', this)">Send</button>';
        list.appendChild(div);
    });
}

function filterShareUsers(query) {
    if (!query.trim()) {
        renderShareUsers(allShareUsers);
        return;
    }
    const q = query.toLowerCase();
    const filtered = allShareUsers.filter(u =>
        u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
    );
    renderShareUsers(filtered);
}

function sendShare(userId, btn) {
    if (!sharePostId) return;
    btn.disabled = true;
    btn.textContent = 'Sending...';
    fetch('/messages/api/share/', {
        method: 'POST',
        headers: {'X-CSRFToken': 'J2piKfV0WBUJzD75sYVyS5DsoZ7USGWhjDRvZaGdVugs4X71YQbaKQ4wbxNUNnV9', 'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'post_id=' + sharePostId + '&user_id=' + userId
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') {
            btn.textContent = 'Sent!';
            btn.style.background = '#00a86b';
            setTimeout(function() {
                closeShareModal();
                const toast = document.getElementById('shareToast');
                toast.classList.add('show');
                setTimeout(function() { toast.classList.remove('show'); }, 2500);
            }, 500);
        } else {
            btn.disabled = false;
            btn.textContent = 'Send';
            alert(data.error || 'Failed to share');
        }
    })
    .catch(function() {
        btn.disabled = false;
        btn.textContent = 'Send';
        alert('Error sharing post');
    });
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('shareModal').classList.contains('active')) {
        closeShareModal();
    }
});

let activeEmojiPicker = null;

function toggleEmojiPicker(wrapperId, inputId) {
    const wrapper = document.getElementById(wrapperId);
    const picker = wrapper.querySelector('.emoji-picker');
    if (activeEmojiPicker && activeEmojiPicker !== picker) {
        activeEmojiPicker.classList.remove('active');
    }
    picker.classList.toggle('active');
    if (picker.classList.contains('active')) {
        activeEmojiPicker = picker;
    } else {
        activeEmojiPicker = null;
    }
}

function insertEmoji(emoji, inputId) {
    const input = document.getElementById(inputId);
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
    input.selectionStart = input.selectionEnd = start + emoji.length;
    input.focus();
}

function buildEmojiPicker(wrapperId, inputId) {
    const wrapper = document.getElementById(wrapperId);
    if (!wrapper) return;
    let picker = wrapper.querySelector('.emoji-picker');
    if (picker) return;
    picker = document.createElement('div');
    picker.className = 'emoji-picker';
    EMOJIS.forEach(e => {
        const span = document.createElement('span');
        span.textContent = e;
        span.onclick = function() { insertEmoji(e, inputId); };
        picker.appendChild(span);
    });
    wrapper.appendChild(picker);
}

document.addEventListener('click', function(e) {
    if (activeEmojiPicker && !e.target.closest('.emoji-wrapper')) {
        activeEmojiPicker.classList.remove('active');
        activeEmojiPicker = null;
    }
});

            badge.textContent = data.count;
            badge.style.display = 'inline';
        } else {
            badge.style.display = 'none';
        }
    });
}
updateNotifBadge();
setInterval(updateNotifBadge, 15000);
