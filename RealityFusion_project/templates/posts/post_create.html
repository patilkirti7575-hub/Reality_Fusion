{% extends 'base.html' %}
{% block title %} - Create Post{% endblock %}
{% block content %}
<style>
    .create-container { max-width: 600px; margin: 0 auto; }
    .create-card { background: #000; border: 1px solid #262626; border-radius: 12px; overflow: hidden; }
    .create-card .card-header { border-bottom: 1px solid #262626; padding: 14px 16px; }
    .create-card .card-header h5 { margin:0; font-size:16px; font-weight:600; }
    .create-card .form-control {
        background: transparent; border: 1px solid #262626;
        color: #f5f5f5; border-radius: 8px; padding: 12px; font-size:14px;
    }
    .create-card .form-control:focus { border-color: #0095f6; box-shadow: none; }
    .create-card .form-control::placeholder { color: #555; }
    .create-card textarea { min-height: 120px; resize: vertical; }
    .preview-area {
        width: 100%; height: 300px; background: #1a1a1a;
        display: flex; align-items: center; justify-content: center;
        color: #555; border-radius: 8px; overflow: hidden; margin-bottom: 16px;
    }
    .preview-area img, .preview-area video { width: 100%; height: 100%; object-fit: contain; }
    .preview-area i { font-size: 48px; }
    .ig-btn-create {
        background: #0095f6; border: none; color: white; padding: 8px 24px;
        border-radius: 8px; font-weight: 600; font-size: 14px; width: 100%; cursor: pointer;
    }
    .ig-btn-create:hover { background: #1877f2; }
    .file-options { display: flex; gap: 12px; margin-bottom: 12px; }
    .file-option {
        flex: 1; text-align: center; padding: 10px; border: 1px dashed #363636;
        border-radius: 8px; cursor: pointer; color: #888; font-size: 13px;
    }
    .file-option:hover { border-color: #555; color: #ccc; }
    .file-option i { font-size: 24px; display: block; margin-bottom: 4px; }
    .file-input-hidden { display: none; }
    .error-box {
        background: #1a1a1a; border: 1px solid #ed4956; color: #ed4956;
        padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
    }
</style>
<div class="create-container">
    <div class="create-card">
        <div class="card-header text-center">
            <h5>New Post</h5>
        </div>
        <div class="card-body p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="preview-area" id="mediaPreview">
                    <i class="bi bi-image"></i>
                </div>

                <div class="file-options">
                    <div class="file-option" onclick="document.getElementById('id_image').click()">
                        <i class="bi bi-image"></i> Photo
                        <input type="file" name="image" id="id_image" accept="image/*" class="file-input-hidden" onchange="previewFile(this)">
                    </div>
                    <div class="file-option" onclick="document.getElementById('id_video').click()">
                        <i class="bi bi-camera-video"></i> Video
                        <input type="file" name="video" id="id_video" accept="video/*" class="file-input-hidden" onchange="previewFile(this)">
                    </div>
                </div>

                <div class="mb-3">
                    <textarea name="content" class="form-control" placeholder="Write a caption..." rows="3"></textarea>
                </div>

                {% if form.errors %}
                <div class="error-box">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}{{ error }}<br>{% endfor %}
                    {% endfor %}
                </div>
                {% endif %}

                <button type="submit" class="ig-btn-create">
                    <i class="bi bi-share"></i> Share
                </button>
                <a href="{% url 'feed' %}" class="d-block text-center mt-2" style="color:#0095f6;font-size:14px;">Discard</a>
            </form>
        </div>
    </div>
</div>
<script>
function previewFile(input) {
    var preview = document.getElementById('mediaPreview');
    if (!input.files || !input.files[0]) return;
    var file = input.files[0];
    if (file.type.startsWith('video/')) {
        preview.innerHTML = '<video src="' + URL.createObjectURL(file) + '" autoplay muted loop playsinline controls style="width:100%;height:100%;object-fit:contain;"></video>';
    } else {
        var reader = new FileReader();
        reader.onload = function(e) {
            preview.innerHTML = '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:contain;">';
        };
        reader.readAsDataURL(file);
    }
}
</script>
{% endblock %}
