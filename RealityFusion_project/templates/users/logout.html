{% extends 'base.html' %}
{% block title %}Logged Out - RealityFusion{% endblock %}
{% block content %}
<style>
    .logout-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .logout-card {
        border: none;
        border-radius: 10px;
        box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        text-align: center;
    }
    .logout-card .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 10px 10px 0 0;
        padding: 30px;
    }
    .logout-card .card-header i {
        font-size: 3rem;
    }
    .logout-card .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 10px;
        border-radius: 5px;
        font-weight: 600;
    }
</style>

<div class="logout-page">
    <div class="col-md-5 col-lg-4">
        <div class="card logout-card">
            <div class="card-header">
                <i class="bi bi-box-arrow-right"></i>
                <h3 class="mt-2">You've been logged out</h3>
                <p class="mb-0 small">Thank you for using RealityFusion</p>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">You have been successfully logged out of your account.</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In Again
                </a>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 mt-2">
                    <i class="bi bi-house-door"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
