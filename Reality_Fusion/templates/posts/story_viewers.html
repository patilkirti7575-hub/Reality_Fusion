<!-- ===== STORY VIEWERS MODAL (reusable snippet) ===== -->
<div class="list-modal-overlay" id="storyViewersModal" onclick="if(event.target===this)closeStoryViewers()">
    <div class="list-modal">
        <div class="list-modal-header">
            <h6>Story Views</h6>
            <button class="close-modal" onclick="closeStoryViewers()">&times;</button>
        </div>
        <div class="list-modal-body" id="storyViewersBody">
            <div class="list-modal-empty"><i class="bi bi-arrow-repeat"></i>Loading...</div>
        </div>
    </div>
</div>

<script>
function openStoryViewers(storyId) {
    var modal = document.getElementById('storyViewersModal');
    var body = document.getElementById('storyViewersBody');
    body.innerHTML = '<div class="list-modal-empty"><i class="bi bi-arrow-repeat"></i>Loading...</div>';
    modal.classList.add('active');
    fetch('/story/' + storyId + '/viewers/')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data.viewers || data.viewers.length === 0) {
            body.innerHTML = '<div class="list-modal-empty"><i class="bi bi-eye-slash"></i><h6>No views yet</h6></div>';
            return;
        }
        var html = '';
        data.viewers.forEach(function(v) {
            var avatar = v.profile_pic
                ? '<img src="' + v.profile_pic + '">'
                : '<div class="avatar-placeholder-sm"><i class="bi bi-person-fill"></i></div>';
            html += '<div class="list-user-row"><a href="/users/profile/' + v.id + '/">' + avatar +
                '<div class="info"><div class="name">' + v.username + '</div><div class="bio">Viewed ' + v.viewed_at + '</div></div></a></div>';
        });
        body.innerHTML = html;
    })
    .catch(function() {
        body.innerHTML = '<div class="list-modal-empty"><i class="bi bi-exclamation-circle"></i><h6>Failed to load</h6></div>';
    });
}

function closeStoryViewers() {
    var modal = document.getElementById('storyViewersModal');
    if (modal) modal.classList.remove('active');
}
</script>
